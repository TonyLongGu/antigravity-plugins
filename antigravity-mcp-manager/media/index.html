<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header (Sticky 固定於頂部遮罩) -->
  <div class="header-wrapper">
    <div class="header-title-row">
      <div class="header-title">
        <svg class="lucide-icon" viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
        <span>MCP 伺服器管理</span>
      </div>
      <div class="header-actions">
        <button id="btn-collapse-all" class="btn-icon" title="摺疊全部卡片">
          <svg class="lucide-icon" viewBox="0 0 24 24"><path d="m4 14 8-8 8 8"/><path d="m4 20 8-8 8 8"/></svg>
        </button>
        <button id="btn-expand-all" class="btn-icon" title="展開全部卡片">
          <svg class="lucide-icon" viewBox="0 0 24 24"><path d="m4 10 8 8 8-8"/><path d="m4 4 8 8 8-8"/></svg>
        </button>
        <button id="btn-test-all" class="btn-icon" title="一鍵測試所有 MCP 連線狀態">
          <svg class="lucide-icon" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        </button>
        <button id="btn-refresh" class="btn-icon" title="重新整理">
          <svg id="refresh-icon" class="lucide-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 內容主容器 -->
  <div class="container">
    
    <!-- 1. 全域配置卡片 (預設展開) -->
    <details class="card" open id="card-global">
      <summary class="card-header">
        <span class="chevron"><svg class="lucide-icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        <span class="card-icon"><svg class="lucide-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>
        <div class="card-title-group">
          <span class="card-title-text">全域配置</span>
        </div>
        <button id="btn-open-global-config" class="btn-action-sm" title="在編輯器開啟全域 mcp_config.json">
          <span>開啟設定檔</span>
        </button>
      </summary>

      <div class="card-body">
        <!-- 全域工具列 -->
        <section class="toolbar">
          <div class="search-box">
            <svg class="search-icon lucide-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="global-search-input" placeholder="搜尋全域 MCP..." autocomplete="off">
            <button id="btn-clear-global-search" class="btn-clear" style="display: none;">✕</button>
          </div>

          <div class="filter-row">
            <div class="filter-pills">
              <button class="pill active" data-scope="global" data-filter="all">全部 <span id="stat-global-total" class="badge">0</span></button>
              <button class="pill" data-scope="global" data-filter="enabled">啟用 <span id="stat-global-enabled" class="badge badge-green">0</span></button>
              <button class="pill" data-scope="global" data-filter="disabled">停用 <span id="stat-global-disabled" class="badge badge-muted">0</span></button>
            </div>
          </div>

          <div class="batch-row">
            <button id="btn-global-enable-all" class="batch-btn batch-green" title="全部啟用">全開</button>
            <button id="btn-global-disable-all" class="batch-btn batch-red" title="全部停用">全關</button>
            <button id="btn-global-invert" class="batch-btn batch-secondary" title="反向選取">反轉</button>
          </div>
          <div class="divider"></div>
        </section>

        <!-- 全域伺服器列表 -->
        <div id="global-servers-list" class="servers-list">
          <!-- 動態注入 -->
        </div>
        <div id="global-empty-state" class="state-box" style="display: none;">
          <span>無相符的全域伺服器</span>
        </div>
      </div>
    </details>

  </div>

  <!-- In-app Toasts -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
