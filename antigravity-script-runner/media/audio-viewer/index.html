<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聲音檢視器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 隱藏原生音訊核心 -->
    <audio id="playerAudio" preload="auto"></audio>

    <!-- 頂部工具列 -->
    <header class="toolbar">
      <!-- 左側：資料夾與計數資訊 -->
      <div class="toolbar-left">
        <div class="folder-info" id="folderInfo" title="資料夾路徑">
          <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
          </svg>
          <span class="folder-name" id="folderName">載入中...</span>
        </div>
        <span class="badge badge-accent" id="audioCountBadge">0 首音訊</span>
        <span class="badge" id="filterCountBadge" style="display:none;">已篩選: 0</span>
      </div>

      <!-- 中間：即時檔名搜尋與排序 -->
      <div class="toolbar-center">
        <!-- 搜尋框 -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="搜尋檔名..." autocomplete="off" spellcheck="false">
          <span class="search-clear" id="searchClear" data-i18n-title="search_clear_title" title="清除搜尋">✕</span>
        </div>

        <!-- 排序選單 -->
        <select id="sortSelect" class="select-input" data-i18n-title="sort_select_title" title="排序依據">
          <option value="name-asc" data-i18n="sort_name_asc">檔名 (A - Z)</option>
          <option value="name-desc" data-i18n="sort_name_desc">檔名 (Z - A)</option>
          <option value="size-desc" data-i18n="sort_size_desc">大小 (大到小)</option>
          <option value="size-asc" data-i18n="sort_size_asc">大小 (小到大)</option>
          <option value="date-desc" data-i18n="sort_date_desc" selected>時間 (新到舊)</option>
          <option value="date-asc" data-i18n="sort_date_asc">時間 (舊到新)</option>
        </select>

        <div class="divider"></div>

        <!-- 卡片尺寸滑桿 -->
        <div class="size-control">
          <span data-i18n="slider_size_label">尺寸</span>
          <input type="range" id="sizeSlider" class="slider-input" min="160" max="360" value="220" data-i18n-title="card_size_slider_title" title="調整卡片尺寸 (160px - 360px，支援 Ctrl + 滑鼠滾輪)">
        </div>
      </div>

      <!-- 右側：子資料夾開關、語言切換與動作按鈕 -->
      <div class="toolbar-right">
        <!-- 包含子資料夾切換 -->
        <button id="recursiveBtn" class="btn-icon" data-i18n-title="btn_recursive_title" title="包含子資料夾中的所有音訊">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 3 7 7-7 7"></path>
            <path d="m13 7 4 4-4 4"></path>
          </svg>
          <span data-i18n="btn_recursive">子資料夾</span>
        </button>

        <!-- 重新整理 -->
        <button id="refreshBtn" class="btn-icon" data-i18n-title="btn_refresh_title" title="重新掃描資料夾 (F5)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
          <span data-i18n="btn_refresh">重新整理</span>
        </button>

        <!-- 在系統檔案總管中開啟 -->
        <button id="revealFolderBtn" class="btn-icon" data-i18n-title="btn_reveal_title" title="在系統檔案總管中開啟此資料夾">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>

        <!-- 語言切換按鈕 -->
        <button id="btn-lang-toggle" class="btn-icon btn-lang" data-i18n-title="btn_lang_toggle_title" title="Switch to English">
          <span id="lang-indicator">EN</span>
        </button>
      </div>
    </header>

    <!-- 畫廊網格展示區 -->
    <main class="gallery-viewport" id="galleryViewport">
      <!-- 框選矩形框 -->
      <div class="selection-marquee" id="selectionMarquee" style="display: none;"></div>

      <!-- 網格容器 -->
      <div class="gallery-grid" id="galleryGrid"></div>

      <!-- 空資料夾/無符合搜尋狀態 -->
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <div class="empty-title" id="emptyTitle" data-i18n="empty_title">此資料夾內沒有支援的音訊</div>
        <div class="empty-desc" id="emptyDesc" data-i18n="empty_hint">支援格式：MP3, WAV, FLAC, M4A, OGG, AAC, WMA, AIFF, OPUS, WEBA 等。您可以嘗試開啟子資料夾搜尋或點擊重新整理。</div>
      </div>
    </main>

    <!-- 底部浮動批量操作工具列 (Batch Action Bar) -->
    <div class="batch-action-bar" id="batchActionBar" style="display: none;">
      <div class="batch-info">
        <span class="batch-count-badge" id="batchSelectedCount">已選取 0 首</span>
      </div>
      <div class="batch-divider"></div>
      <div class="batch-buttons">
        <!-- 複製路徑 -->
        <button id="batchCopyPathsBtn" class="batch-btn batch-btn-primary" data-i18n-title="batch_copy_title" title="複製選取音訊的絕對路徑列表（每行一個路徑，適合貼到 AI 對話）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          <span data-i18n="batch_copy_text">複製路徑</span>
        </button>

        <!-- 刪除檔案 -->
        <button id="batchDeleteBtn" class="batch-btn batch-btn-danger" data-i18n-title="batch_delete_title" title="將選取檔案移至系統資源回收筒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          <span data-i18n="batch_delete_text">刪除</span>
        </button>

        <div class="batch-divider"></div>

        <!-- 取消選取 -->
        <button id="batchClearBtn" class="batch-btn batch-btn-ghost" data-i18n-title="batch_clear_title" title="取消所有選取 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- 底部常駐播放控制列 (Bottom Docked Audio Player) - 完全比照檢視影片 (Video Viewer) 排版 -->
    <footer class="docked-player-bar" id="dockedPlayerBar" style="display: none;">
      <!-- 1. 尋道進度條 (橫跨頂部全寬度，極致尋道精度) -->
      <div class="progress-bar-container" id="progressContainer" data-i18n-title="ctrl_progress_title" title="尋道跳轉 (點擊或拖曳)">
        <div class="progress-bar-buffered" id="progressBarBuffered"></div>
        <div class="progress-bar-played" id="progressBarPlayed"></div>
        <div class="progress-thumb" id="progressThumb"></div>
        <div class="progress-tooltip" id="progressTooltip">00:00</div>
      </div>

      <!-- 2. 下方單行控制列 (比照 Video Viewer controls-row) -->
      <div class="controls-row">
        <!-- 左側：播放控制與時間 -->
        <div class="controls-left">
          <!-- 播放 / 暫停 (Space) -->
          <button id="playPauseBtn" class="ctrl-btn" data-i18n-title="ctrl_play_pause_title" title="播放 / 暫停 (Space)">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>

          <!-- 上一首 -->
          <button id="prevBtn" class="ctrl-btn" data-i18n-title="player_prev_title" title="上一首 (← / [)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>

          <!-- 下一首 -->
          <button id="nextBtn" class="ctrl-btn" data-i18n-title="player_next_title" title="下一首 (→ / ])">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>

          <!-- 時間顯示 (比照 Video Viewer) -->
          <div class="time-display" id="timeDisplay">
            <span id="currentTimeText">00:00</span> / <span id="durationText">00:00</span>
          </div>
        </div>

        <!-- 中間：當前播放曲目膠囊徽章 (自適應縮排，避免擁擠) -->
        <div class="controls-center">
          <div class="player-track-pill" id="playerTrackPill">
            <div class="player-disc-mini" id="playerMiniDisc">
              <div class="disc-dot"></div>
            </div>
            <div class="player-track-info">
              <div class="player-track-title" id="playerTitle" title="">未播放</div>
              <div class="player-track-meta" id="playerMeta">-</div>
            </div>
          </div>
        </div>

        <!-- 右側：功能操作群組 -->
        <div class="controls-right">
          <!-- 自動連續播放開關 (預設關閉：播完單曲即停止) -->
          <button id="autoNextBtn" class="ctrl-btn" data-i18n-title="player_autonext_title" title="自動播放下一首開關 (C)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h11M3 12h8M3 18h8"/>
              <polygon points="16 10 22 14 16 18 16 10" fill="currentColor"/>
            </svg>
          </button>

          <!-- 單曲循環開關 -->
          <button id="loopBtn" class="ctrl-btn" data-i18n-title="player_loop_title" title="單曲循環開關 (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m17 2 4 4-4 4"></path>
              <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
              <path d="m7 22-4-4 4-4"></path>
              <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>

          <!-- 播放倍速切換 -->
          <div class="speed-dropdown-wrapper">
            <button id="speedBtn" class="ctrl-btn btn-text" data-i18n-title="player_speed_title" title="切換播放速度">1.0x</button>
            <div class="speed-menu" id="speedMenu" style="display: none;">
              <div class="speed-item" data-speed="0.5">0.5x</div>
              <div class="speed-item" data-speed="0.75">0.75x</div>
              <div class="speed-item" data-speed="1.0">1.0x</div>
              <div class="speed-item" data-speed="1.25">1.25x</div>
              <div class="speed-item" data-speed="1.5">1.5x</div>
              <div class="speed-item" data-speed="2.0">2.0x</div>
            </div>
          </div>

          <!-- 音量控制組 (常駐顯示滑桿與青色手柄) -->
          <div class="volume-control-group">
            <button id="volumeBtn" class="ctrl-btn" data-i18n-title="ctrl_mute_title" title="靜音切換 (M)">
              <svg class="icon-vol-high" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <svg class="icon-vol-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>
            <div class="volume-slider-wrapper">
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.5" data-i18n-title="ctrl_volume_title" title="音量調節 (滾輪或 ↑/↓)">
            </div>
          </div>

          <!-- 以系統播放器開啟 (完全比照 Video Viewer) -->
          <button id="ctrlOpenExternalBtn" class="ctrl-btn" data-i18n-title="ctrl_open_external_title" title="以系統播放器開啟 (O)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15.033 9.44a.647.647 0 0 1 0 1.12l-4.065 2.352a.645.645 0 0 1-.968-.56V7.648a.645.645 0 0 1 .967-.56z"></path>
              <path d="M12 17v4"></path>
              <path d="M8 21h8"></path>
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            </svg>
          </button>

          <!-- 停止播放並隱藏播放列 -->
          <button id="closePlayerBtn" class="ctrl-btn" data-i18n-title="player_close_title" title="關閉播放器 (Esc)">✕</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Toast 通知容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="locales.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
